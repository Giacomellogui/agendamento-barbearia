<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendamento da barbearia</title>
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body>
    <!-- Barra com o seletor de tema compartilhado com o painel. -->
    <header class="barra">
      <span class="marca">Barbearia</span>
      <label class="seletor-tema" for="tema">Tema
        <select id="tema">
          <option value="claro">Claro</option>
          <option value="escuro">Escuro</option>
        </select>
      </label>
    </header>
    <main class="cartao">
      <h1>Agende seu horário</h1>

      <!-- Os IDs conectam os campos do formulário ao TypeScript. -->
      <form id="agendamento">
        <fieldset id="campos" class="campos-formulario">
          <label for="servico">Escolha um serviço</label>
          <select id="servico" required>
            <option value="">Selecione...</option>
          </select>
          <p>
            <label for="data">Escolha uma data</label>
            <input type="date" id="data" name="data" required />
          </p>
          <p>
            <label for="horario">Escolha um horário</label>
            <select id="horario" required disabled>
              <option value="">Escolha um serviço e uma data</option>
            </select>
          </p>
          <p>
            <label for="nome">Seu nome</label>
            <input id="nome" autocomplete="name" maxlength="100" required />
          </p>
          <button id="confirmar" class="botao-principal" type="submit" disabled>
              Confirmar agendamento
          </button>
        </fieldset>
      </form>
      <!-- Área de feedback da confirmação da reserva. -->
      <p id="mensagem" role="status"></p>
    </main>
    <!-- Módulos gerados pela compilação do TypeScript. -->
    <script type="module" src="/tema.js"></script>
    <script type="module" src="/agendamento.js"></script>
  </body>
</html>
